reason: >
  RE-AUDITED after the risk-manager fix (see
  docs/research/ou_gbm_risk_manager_fix_reaudit.md). This CORRECTS the
  prior entry, which assumed "by strong analogy to EXP-0013" without
  independently re-tracing this config - that analogy turns out to be
  WRONG for this specific config. Instrumented directly
  (core.execution.signal_pipeline.SignalPipeline._emit): over the full
  window this config generates exactly 1 signal, and it is rejected at
  the SIZING stage (reason="price_exceeds_capital_per_trade"), never even
  reaching SimpleIntradayRiskManager's brokerage-clearance check. The
  brokerage-ratio fix is irrelevant to this config's blocker - still 0
  trades, but for an unrelated, not-yet-investigated position-sizing
  reason. Stays archived: no statistical verdict is possible with 0
  trades either way, and the actual blocker here needs separate
  investigation (position-sizing engine vs. this strategy/pair's price
  level), out of scope for this re-audit.
