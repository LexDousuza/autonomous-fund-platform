id: EXP-0014
hypothesis: >
  A stock's return residual against a single paired reference symbol
  (HDFCBANK) mean-reverts (pairs-trading variant of EXP-0015).
economic_mechanism: >
  A single stock's raw price has no principled reason to have a stable
  equilibrium - it drifts with whatever the broad market is doing. The
  residual left after removing market-beta-explained return (stock return
  minus beta*market return, beta refit every bar via OLS against an
  equal-weighted proxy excluding the symbol itself) is hypothesized to be
  mean-reverting instead - the same reasoning real statistical-arbitrage
  desks use for pairs/basket residuals rather than raw prices. See
  docs/strategy-specs/ornstein_uhlenbeck_residual.md.

dataset: data/processed/nse_5min_dev.csv
period: {train_or_dev: "nse_5min_dev.csv, 123 trading days", holdout: null}
parameters: {pair_symbol: HDFCBANK, lookback_bars: 60, entry_z_threshold: 2.0, min_t_stat: 3.5, min_half_life_minutes: 15.0, max_half_life_minutes: 75.0}

bootstrap_ci: {point_estimate: null, lower: null, upper: null, n_resamples: null}
p_value: null
fdr_corrected: null
