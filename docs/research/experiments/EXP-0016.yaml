id: EXP-0016
hypothesis: Statistically-fit GBM drift (5-min bars) predicts continuation when significant.
economic_mechanism: >
  Replaces momentum's fixed price/volume thresholds with a formal one-sample
  t-test on fitted drift (mu) of a GBM model - the hypothesis is that
  drift statistically distinguishable from zero over the lookback window
  reflects genuine directional order flow (not noise) that continues
  briefly. Doesn't share raw-OU's small-sample bias problem - a one-sample
  t-test on a mean is a standard, well-behaved test, verified empirically
  to clear only ~1-2% of the time on simulated zero-drift noise. See
  docs/strategy-specs/gbm_momentum.md.

dataset: data/processed/nse_5min_dev.csv
period: {train_or_dev: "nse_5min_dev.csv, 123 trading days", holdout: null}
parameters: {lookback_bars: 60, min_t_stat: 2.5, session_window_minutes: null}

bootstrap_ci: {point_estimate: null, lower: null, upper: null, n_resamples: null}
p_value: null
fdr_corrected: null
kill_criteria_result: {ci_lower_bound_above_1: null, fdr_p_under_threshold: null, holdout_drop_under_25pct: null, walk_forward_sign_consistent: null}

