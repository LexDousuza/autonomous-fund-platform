decision: archived
reason: >
  RE-AUDITED after the risk-manager fix (gbm_momentum now gets the 1.3x
  override too - see docs/research/ou_gbm_risk_manager_fix_reaudit.md).
  This CORRECTS the prior entry's mechanism claim: the "exact algebraic
  tie at 2.0x" story explained why EVERY trade was rejected at the old
  ratio, but re-instrumenting after the fix shows the real position sizes
  in this dataset never actually reach the ~Rs 5,000-20,000 band where
  that proportional-rate tie would apply - they're small enough that
  Groww's Rs 5 floor dominates instead (same mechanism as the OU family,
  not the tie). 20 signals still rejected at the risk_manager stage post-
  fix, sample metadata: projected_profit=Rs 2.98-2.99 vs.
  min_required_profit=Rs 6.50 (1.3 x Rs 5.00 floor) - the 1.3x
  recalibration wasn't enough to clear this config's real, smaller
  notional. Still 0 trades, still archived - the actual blocker for THIS
  config was the floor, not the tie the original diagnosis emphasized.
