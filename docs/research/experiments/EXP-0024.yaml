python_version: "3.14.2"
random_seed: 0

date_opened: 2026-08-03
date_decided: 2026-08-03
decision: fail
reason: >
  docs/research/validation_audit_phase2_longer_hold.md: full Phase 2
  battery at a 15-day max hold. BANKNIFTY's holdout PF (0.829) stays flat
  and below 1 across all three tested hold lengths (0.813 @5d, 0.831 @10d,
  0.829 @15d) even as its dev PF keeps rising with hold length the same way
  NIFTY's does (1.023 -> 1.170 -> 1.358) - the DEV/HOLDOUT divergence gets
  WORSE with a longer hold (25% -> 29% -> 39% drop), the opposite of what a
  real, generalizing edge should do. This is the clearest evidence in the
  whole longer-hold investigation that hold length is not the fix for
  credit_spread on BANKNIFTY specifically - see
  validation_audit_phase2_longer_hold.md's per-symbol verdict section.

  Should not proceed to Tier B as currently designed.
