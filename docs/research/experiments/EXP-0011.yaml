decision: fail
reason: >
  82 trades, CI [0.06, 0.52] entirely below 1, p=0.0005 - significant loss
  on THIS significance check (bootstrap/permutation on the dev-period
  sample). Narrower filter than plain pullback (82 vs 312 trades) improved
  the point estimate (0.22 vs 0.24) only marginally and the strategy is
  still a confirmed loser on this basis. This is a different question from
  validate_hybrid_holdout.py's own dev-vs-holdout result for the same
  strategy - reconcile the two before treating either as final; that script
  used a tuned parameter set (BEST_PARAMS/BEST_PROFILE), not this config
  file's defaults.
