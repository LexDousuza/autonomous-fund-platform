id: EXP-0013
hypothesis: Statistically-fit OU mean-reversion (5-min bars) predicts reversion to a rolling equilibrium.
economic_mechanism: >
  A stock's own log-price is hypothesized to revert toward a rolling
  equilibrium (mu) at a fitted rate (theta) - noise traders push price away
  from fair value, arbitrageurs pull it back. Only fires when the fit clears
  a high significance bar (min_t_stat=3.5, not the usual ~2) because a naive
  theta>0 check is known to spuriously detect "reversion" in a pure random
  walk in ~29% of simulated cases (the same finite-sample bias the
  Augmented Dickey-Fuller test exists to correct for) - see
  docs/strategy-specs/ornstein_uhlenbeck.md for the full model.

dataset: data/processed/nse_5min_dev.csv
period: {train_or_dev: "nse_5min_dev.csv, 123 trading days", holdout: null}
parameters: {lookback_bars: 60, entry_z_threshold: 2.0, min_t_stat: 3.5, min_half_life_minutes: 15.0, max_half_life_minutes: 75.0, min_remaining_half_lives: 2.0}

bootstrap_ci: {point_estimate: 0.0, lower: null, upper: null, n_resamples: 0}
p_value: 1.0
fdr_corrected: false
kill_criteria_result: {ci_lower_bound_above_1: false, fdr_p_under_threshold: false, holdout_drop_under_25pct: null, walk_forward_sign_consistent: null}

