date_opened: 2026-07-28
date_decided: 2026-08-05
decision: archived
reason: >
  RE-AUDITED after the risk-manager fix (core.risk.simple_intraday now
  supports a per-strategy min_profit_to_brokerage_ratio override; this
  family gets 1.3 instead of the global 2.0 - see
  docs/research/ou_gbm_risk_manager_fix_reaudit.md). This CORRECTS the
  earlier "no_signals_generated" story (already superseded once, see git
  history) and now supersedes the interim "blocked by a calibration bug"
  finding too: the fix landed, the previously-rejected signal now clears
  the brokerage check and is approved and filled - but a REAL statistical
  verdict was possible for the first time, and it's negative. Over the
  full nse_5min_dev.csv window (123 days), the fix unblocks exactly 1
  trade, which lost money (profit_factor point estimate 0.0). n=1 is too
  few for a bootstrap CI (undefined) or a meaningful permutation test
  (p=1.0, uninformative). Verdict: NOT a validated edge, and not enough
  data to call it a confirmed loser either - the strategy's own
  min_t_stat=3.5 entry gate is simply this strict against this dataset,
  independent of the risk-manager bug now fixed. Archived: the risk-
  manager blocker is gone, but this exact config/dataset combination has
  nothing left to learn from without materially more history.
