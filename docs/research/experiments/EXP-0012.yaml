reason: >
  This strategy's only prior evaluation was on SYNTHETIC data (its own
  config comment: "a multi-day synthetic backtest... not a real-market
  performance claim"). This is its first real-data result: 653 trades
  (most of any strategy tested this batch), CI [0.07, 0.13] far below 1,
  p=0.0000 - a decisive, significant loss. The breakout_lookback_bars=5
  parameter choice was tuned against synthetic noise, not real market
  structure - unsurprising it doesn't transfer.
