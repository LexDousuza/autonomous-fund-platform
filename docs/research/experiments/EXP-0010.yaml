id: EXP-0010
hypothesis: A pullback within an established uptrend continues the trend on resumption.
economic_mechanism: >
  Within an established uptrend, a short-term dip is hypothesized to be
  profit-taking/noise rather than a trend reversal - the strategy waits
  for price to turn back up (a green candle above the previous close)
  before betting on trend resumption, capturing the continuation without
  chasing the initial breakout. See docs/strategy-specs/pullback.md.

dataset: data/processed/nse_5min_dev.csv
period: {train_or_dev: "nse_5min_dev.csv, 123 trading days", holdout: null}
parameters: {trend_lookback_bars: 20, pullback_lookback_bars: 3, min_pullback_pct: 0.3}

