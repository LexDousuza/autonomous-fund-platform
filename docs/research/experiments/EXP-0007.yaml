reason: >
  Only 8 trades on this dataset - CI is wide [0.12, 2.43] and p=0.578, not
  significant in either direction. This is "not enough evidence," distinct
  from EXP-0008 through EXP-0012 below, which have enough trades to show a
  significant loss. Don't conflate the two when reading this batch.
