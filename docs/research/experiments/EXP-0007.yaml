id: EXP-0007
hypothesis: Fixed "% price change + volume multiplier" momentum predicts continuation.
economic_mechanism: >
  A stock moving hard on real, above-average volume early in the session is
  hypothesized to be getting bid up on genuine order flow rather than noise
  - the bet is that momentum/continuation traders extend the move further
  before it exhausts, and that catching it early in the session (not hours
  in) leaves the most room left to run. See
  docs/strategy-specs/momentum.md.

dataset: data/processed/nse_5min_dev.csv
period: {train_or_dev: "nse_5min_dev.csv, 123 trading days", holdout: null}
parameters: {lookback_bars: 10, min_price_change_pct: 1.0, min_volume_multiplier: 1.5, session_window_minutes: 90}

bootstrap_ci: {point_estimate: 0.6365632720285479, lower: 0.12261492633443363, upper: 2.429698506621584, n_resamples: 1998}
p_value: 0.578
fdr_corrected: false   # Benjamini-Hochberg across all 10 experiments with a computed p-value, fdr=0.05
kill_criteria_result: {ci_lower_bound_above_1: false, fdr_p_under_threshold: false, holdout_drop_under_25pct: null, walk_forward_sign_consistent: null}

