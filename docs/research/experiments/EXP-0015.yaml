reason: >
  RE-AUDITED after the risk-manager fix (see
  docs/research/ou_gbm_risk_manager_fix_reaudit.md), independently
  re-traced (not by analogy this time). Still 0 trades over the full
  window, and the fix helped but wasn't enough here: instrumentation
  shows 1 rejection at the risk_manager stage
  (reason="projected_profit_below_brokerage_threshold") with
  projected_profit=Rs 5.61 vs. min_required_profit=Rs 6.50 at the new,
  lower 1.3x ratio (brokerage_cost=Rs 5.00, the floor). The recalibration
  narrowed the gap (was Rs 10.00 required at the old 2.0x ratio) but this
  particular signal's real notional still doesn't clear even the reduced
  bar - a genuine, smaller-than-EXP-0013's-example position size, not a
  bug. Stays archived: 0 trades, no statistical verdict possible.
