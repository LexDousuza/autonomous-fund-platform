id: EXP-0015
hypothesis: >
  A stock's return residual against a broad equal-weighted market proxy
  (built from every symbol in the backtest) mean-reverts.
economic_mechanism: >
  Same mechanism as EXP-0014 (market-beta residual mean-reversion),
  different bar interval/config - a stock's return net of its market-beta
  exposure is hypothesized to revert, unlike its raw price. See
  docs/strategy-specs/ornstein_uhlenbeck_residual.md.

dataset: data/processed/nse_5min_dev.csv
period: {train_or_dev: "nse_5min_dev.csv, 123 trading days", holdout: null}
parameters: {lookback_bars: 60, entry_z_threshold: 2.0, min_t_stat: 3.5, min_half_life_minutes: 15.0, max_half_life_minutes: 75.0}

