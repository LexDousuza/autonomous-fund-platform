reason: >
  RE-AUDITED after the risk-manager fix (see
  docs/research/ou_gbm_risk_manager_fix_reaudit.md), independently
  re-traced (not by analogy this time - the analogy in the prior entry
  turns out to be wrong for the reason, see EXP-0016's corrected entry).
  Still 0 trades over the full nse_1min_recent.csv window after the fix:
  5 signals rejected at the risk_manager stage, sample metadata:
  projected_profit=Rs 4.78-4.79 vs. min_required_profit=Rs 6.50 (1.3 x Rs
  5.00 - Groww's floor, not the proportional rate). This config's real
  position sizes never reach the notional band where the "exact 2x tie"
  story would even apply - same floor-domination mechanism as the OU
  family, not the algebraic tie. The 1.3x recalibration narrowed the gap
  (Rs 6.50 required vs. Rs 10.00 at the old 2.0x) but wasn't enough to
  clear it here. Still archived: 0 trades, no statistical verdict
  possible.
