decision: archived
reason: >
  needs_historical_data. This strategy's params["news_feed"], if not
  injected, falls back to constructing a real, LIVE core.news.google_news_feed.GoogleNewsFeed
  (confirmed in config/strategies/news_sentiment_signal.yaml's own
  comment) - there is no historical news archive wired into this
  codebase. Running it through a historical backtest without one would
  either fail outright or silently fetch TODAY's news regardless of the
  simulated historical date, which is both non-reproducible and a
  look-ahead-bias risk, not a real backtest. Cannot be meaningfully
  re-audited until historical news data exists - archived, not failed
  (failure implies a real result that didn't hold up; this strategy has
  never produced a real one to fail).
