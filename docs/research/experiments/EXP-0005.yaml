decision: archived
reason: >
  needs_dedicated_backtest_harness. Requires an injected option_chain_provider
  (same as vertical_credit_spread), but unlike credit_spread - which got its
  own scripts/backtest_credit_spread_multi_day.py specifically to enable
  this - no equivalent script exists for options_mispricing, and it is not
  registered in apps/backtester/run_backtest.py's generic strategy set
  (confirmed: the only appearance of "options_mispricing" in that file is a
  comment, not an import/registration). This strategy has never been
  backtested against real data. Building that harness is new engineering
  work, not a re-audit of an existing claim - out of Phase 1's scope
  (re-audit what's already been tested), candidate for its own follow-up
  once Phase 1-4 are through.
