id: EXP-0017
hypothesis: >
  Statistically-fit OU mean-reversion (1-min bars, lookback_bars=300 -
  the config this project's own comments treat as canonical/tuned) predicts
  reversion to a rolling equilibrium.
economic_mechanism: >
  Same mechanism as EXP-0013 (raw-price OU mean-reversion), different bar
  interval/config - a stock's log-price reverts to a fitted rolling
  equilibrium; only fires above a high significance bar to guard against
  spurious reversion detection on a true random walk. See
  docs/strategy-specs/ornstein_uhlenbeck.md.

dataset: data/processed/nse_1min_recent.csv
period: {train_or_dev: "nse_1min_recent.csv", holdout: null}
parameters: {lookback_bars: 300, entry_z_threshold: 2.0, min_t_stat: 3.5, min_half_life_minutes: 15.0, max_half_life_minutes: 75.0, min_remaining_half_lives: 2.0}

bootstrap_ci: {point_estimate: 0.0, lower: 0.0, upper: 0.0, n_resamples: 2000}
p_value: 0.492
fdr_corrected: false
kill_criteria_result: {ci_lower_bound_above_1: false, fdr_p_under_threshold: false, holdout_drop_under_25pct: null, walk_forward_sign_consistent: null}

git_commit: b32f494a980aa65e74b7e5753caa8dae3237e725
config_version: config/strategies/ornstein_uhlenbeck.yaml
data_snapshot_id: sha256:9740088847bc771be51ada7a25865bad242a18b7e93cc997e7bd739f511e3363
python_version: "3.14.2"
random_seed: 0

date_opened: 2026-07-28
date_decided: 2026-08-05
decision: archived
reason: >
  RE-AUDITED after the risk-manager fix (see
  docs/research/ou_gbm_risk_manager_fix_reaudit.md) - a REAL statistical
  verdict was possible for the first time. Over the full
  nse_1min_recent.csv window, the fix unblocks exactly 2 trades, BOTH
  losers (NSE:HINDUNILVR pnl=-27.41, NSE:TCS pnl=-2.73 - the second
  exited on "target" but still net-lost after costs). profit_factor point
  estimate 0.0, 90% bootstrap CI [0.0, 0.0], permutation p=0.492 (not
  significant, n=2 is too small to distinguish from noise either way).
  Verdict: NOT a validated edge. Doesn't clear the bar to call it a
  confirmed loser either (p>0.05, doesn't survive FDR) - just a small,
  negative-point-estimate sample. The risk-manager blocker is resolved;
  this specific config/dataset combination shows no edge and needs
  materially more history to say more. Archived.
