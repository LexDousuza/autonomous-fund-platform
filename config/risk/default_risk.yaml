risk:
  max_daily_loss: 2500
  max_trades_per_day: 6
  stop_new_entries_after: "14:45"
  force_square_off_at: "15:20"

position_sizing:
  max_capital_per_trade_pct_of_intraday_bucket: 0.25
  max_open_positions: 3

safety:
  kill_switch_on_broker_error: true
  kill_switch_on_repeated_order_rejections: true