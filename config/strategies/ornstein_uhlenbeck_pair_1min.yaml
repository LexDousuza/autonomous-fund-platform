strategy:
  name: ornstein_uhlenbeck_residual

# 1-minute-bar variant of ornstein_uhlenbeck_pair.yaml (lookback_bars=300
# instead of 60 - see ornstein_uhlenbeck.yaml's own 1-min/5-min comment
# for why only this one param needs to change across bar intervals).
params:
  pair_symbol: "HDFCBANK"
  lookback_bars: 300
  entry_z_threshold: 2.0
  min_t_stat: 3.5
  min_half_life_minutes: 15.0
  max_half_life_minutes: 75.0
  square_off_time: "15:10"
  min_remaining_half_lives: 2.0
  allow_multiple_entries: false

candidate_profile: {}
