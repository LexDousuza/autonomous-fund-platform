strategy:
  name: simple_breakout_momentum

# Links this config to its authoritative research-registry entry so
# tests/integration/test_portfolio_governance.py can verify active
# strategies are actually Validated/Pass, not just present in
# active_portfolio.yaml.
research_registry_id: EXP-0012

# breakout_lookback_bars=5: a multi-day synthetic backtest (see
# core/backtest/) showed lookback=5 consistently beating lookback=1 on
# profit factor and max drawdown - comparing against just 1 prior bar
# reacts to single-bar noise rather than a real breakout. Synthetic-data
# finding, not a real-market performance claim.
params:
  breakout_lookback_bars: 5
  min_volume_multiplier: 1.0
  allow_multiple_entries: false
  quantity_per_trade: 5

# No candidate_profile here (see core/market_data/candidate_profile.py) -
# deliberately left at today's exact generic selection behavior
# (affordability + volatility ceiling, no liquidity/trend pre-filter).
# The new momentum/pullback/ma_crossover strategies (config/strategies/)
# opt into the stricter liquidity+uptrend screen from day one instead;
# retrofitting it here would change this already-shipped strategy's
# live behavior (it could now select zero candidates on a session with
# under trend_lookback_bars of price history) without a deliberate
# decision to accept that.
candidate_profile: {}