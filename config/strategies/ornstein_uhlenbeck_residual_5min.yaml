strategy:
  name: ornstein_uhlenbeck_residual

# 5-minute-bar variant of ornstein_uhlenbeck_residual.yaml - only
# lookback_bars differs (60 bars = ~5 real-world hours at 5-minute bars,
# vs 300 bars at 1-minute bars for the same real-world window). See
# ornstein_uhlenbeck_5min.yaml's comment for why only this one param
# needs to change across bar intervals.
params:
  lookback_bars: 60
  entry_z_threshold: 2.0
  min_t_stat: 3.5
  min_half_life_minutes: 15.0
  max_half_life_minutes: 75.0
  square_off_time: "15:10"
  min_remaining_half_lives: 2.0
  allow_multiple_entries: false

candidate_profile: {}
